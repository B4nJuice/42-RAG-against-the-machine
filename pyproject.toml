[project]
name = "42-rag-against-the-machine"
author = "lgirard"
version = "0.1.0"
description = "Build a Retrieval-Augmented Generation system that answers questions about codebases by retrieving relevant information and generating evidence-based responses, implementing intelligent chunking, efficient retrieval (TF-IDF/BM25)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fire>=0.7.1",
    "langchain-text-splitters==1.1.2",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "sentence-transformers>=6.3.0",
    "tqdm>=4.70.0",
    "transformers[torch]>=5.16.1",
]

[tool.uv]
cache-dir = "/tmp/.uv_cache"
link-mode = "symlink"

[tool.basedpyright]
include = ["src"]
exclude = ["data", "moulinette", "learning", "private", "**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
